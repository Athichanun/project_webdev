<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stlyer/stlye.css">
</head>

<body>
    <nav>
        <div class="logo">
            <!-- <img src="" alt=""> -->
            <h2>logo
            </h2>
        </div>
        <div class="page_bar">
            <ul class="nav-links">
                <li><a href="main.html" class="active">Home</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="offers.html">Offers</a></li>
                <li><a href="location.html">Location</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <button class="btn">BOOK NOW</button>
        </div>
    </nav>
    <section>
        <div class="photo">
            <img src="" alt=""> <!--ดึงจากdata base-->
        </div>
    </section>
    <div class="search_bar">
        <form class="search_bar_container" id="search-form">
            <div class="checkIn">
                <label for="check-in">เช็คอิน</label>
                <input type="date" id="check-in">
            </div>
            <div class="checkOut">
                <label for="check-out">เช็คเอาท์</label>
                <input type="date" id="check-out">
            </div>
            <div class="guest">
                <label for="guest-count">ผู้เข้าพัก (Guests)</label>
                <input type="number" id="guest-count" min="1" max="10" placeholder="ระบุจำนวน">
            </div>
            <button type="submit" id="search-btn">ค้นหาห้องพัก</button>
        </form>
    </div>
    <div class="promotion">
        <p>โปรโมชั่น</p>
    </div>
    <main class="main_container">
        <div class="text">
            <h2>ห้องพักของเรา</h2>
            <p>OUR ROOMS</p>
        </div>
        <div class="room" id="rooms-list">
            <!-- ข้อมูลห้องพักโหลดผ่าน PHP/JavaScript -->
        </div>
    </main>
    <footer>
        <h2>Azure resort</h2>
    </footer>

    <script>
        // ฟังก์ชันค้นหาและดึงข้อมูลห้องพัก
        function fetchRooms() {
            const checkIn = document.getElementById('check-in').value;
            const checkOut = document.getElementById('check-out').value;
            const guests = document.getElementById('guest-count').value;

            const params = new URLSearchParams();
            if (checkIn) params.append('check_in', checkIn);
            if (checkOut) params.append('check_out', checkOut);
            if (guests) params.append('guests_num', guests);

            const queryString = params.toString() ? `?${params.toString()}` : '';
            const url = `../script/mainPage.php${queryString}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderRooms(data.data);
                    } else {
                        document.getElementById('rooms-list').innerHTML = '<p style="text-align:center;">ไม่สามารถโหลดข้อมูลห้องพักได้</p>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching rooms:', error);
                    document.getElementById('rooms-list').innerHTML = '<p style="text-align:center;">เกิดข้อผิดพลาดในการเชื่อมต่อ</p>';
                });
        }

        // ฟังก์ชันแสดงการ์ดห้องพัก
        function renderRooms(rooms) {
            const container = document.getElementById('rooms-list');
            if (!rooms || rooms.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding: 20px;">ไม่พบห้องพักที่ตรงกับเงื่อนไข</p>';
                return;
            }

            let html = '';
            rooms.forEach(room => {
                const price = Number(room.price).toLocaleString();
                const imgSrc = room.image_url || '';
                html += `
                <div class="card" style="display: flex; gap: 20px; align-items: center; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
                    <img src="${imgSrc}" alt="${room.room_name}" style="width: 200px; height: 140px; object-fit: cover; border-radius: 6px; background-color: #eee;">
                    <div class="card-content" style="flex: 1;">
                        <h3 style="margin-bottom: 8px; color: #333;">${room.room_name}</h3>
                        <p style="color: #666; margin-bottom: 8px; font-size: 14px;">${room.description || ''}</p>
                        <p style="font-size: 13px; color: #888;">
                            👥 รองรับ: ${room.max_guests} ท่าน | 🛏️ เตียง: ${room.bed_type || '-'} | 📐 ${room.room_size || '-'} ตร.ม.
                        </p>
                        <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 18px; font-weight: bold; color: #14a2e4;">${price} ฿ <small style="font-size: 12px; color: #666; font-weight: normal;">/ คืน</small></span>
                            <a href="rooms.html" style="background-color: #14a2e4; color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 14px;">ดูรายละเอียด</a>
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        // จัดการ Submit ฟอร์มค้นหา
        document.getElementById('search-form').addEventListener('submit', function (e) {
            e.preventDefault();
            fetchRooms();
        });

        // เมื่อโหลดหน้าเว็บเสร็จ ให้แสดงข้อมูลห้องพักทั้งหมดทันที
        document.addEventListener('DOMContentLoaded', fetchRooms);
    </script>
</body>

</html>
